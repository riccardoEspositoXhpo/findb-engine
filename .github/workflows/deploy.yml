name: Deploy FinDB Engine to Cloud Run Jobs

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: findb-engine
  REGION: europe-west1
  JOB_NAME: findb-nitejob
  MONTHLY_JOB_NAME: findb-monthjob

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run Job from GitHub Repo
        run: |
          gcloud run jobs deploy ${{ env.JOB_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --max-retries 1 \
            --task-timeout 60m

      # Dry run (transaction rolled back) of the image just deployed: before the deploy it tested the old code
      - name: Test Cloud Run Job
        run: |
          gcloud run jobs execute ${{ env.JOB_NAME }} \
            --region ${{ env.REGION }} \
            --update-env-vars DRY_RUN=true \
            --wait

      # Monthly job (lookthrough): a copy of the daily job just deployed (image, env / secrets, service account,
      # timeout) with its own entry point, so the two never drift apart
      - name: Deploy Monthly Cloud Run Job
        run: |
          gcloud run jobs describe ${{ env.JOB_NAME }} --region ${{ env.REGION }} --format export > monthly-job.yaml
          yq -i '
            .metadata.name = "${{ env.MONTHLY_JOB_NAME }}" |
            del(.metadata.annotations) | del(.metadata.labels) |
            .spec.template.spec.template.spec.containers[0].command = ["node"] |
            .spec.template.spec.template.spec.containers[0].args = ["backend/jobs/monthlyBatch.js"]
          ' monthly-job.yaml
          gcloud run jobs replace monthly-job.yaml --region ${{ env.REGION }}

      - name: Test Monthly Cloud Run Job
        run: |
          gcloud run jobs execute ${{ env.MONTHLY_JOB_NAME }} \
            --region ${{ env.REGION }} \
            --update-env-vars DRY_RUN=true \
            --wait
